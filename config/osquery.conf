{
  "options": {
    "logger_path": "/var/log/osquery",
    "host_identifier": "hostname",
    "utc": "true",
    "disable_events": "true"
  },
  "schedule": {
    "samma_osquery_info": {
      "query": "SELECT i.version, i.pid, i.start_time, t.unix_time FROM osquery_info i, time t;",
      "interval": 300,
      "removed": false,
      "description": "Heartbeat: one 'added' row every 5 minutes proves the osquery -> Wazuh -> SIEM path. Not a snapshot: snapshots go to osqueryd.snapshots.log, which the Wazuh module does not read. unix_time makes each run differ; removed rows are suppressed."
    },
    "samma_listening_ports": {
      "query": "SELECT pid, port, protocol, family, address FROM listening_ports WHERE port != 0;",
      "interval": 600,
      "description": "Listening network sockets (Unix sockets, which have port 0, are left out); differential, so only opened and closed ports are reported."
    },
    "samma_processes": {
      "query": "SELECT pid, name, path, uid FROM processes;",
      "interval": 3600,
      "description": "Running processes; differential. cmdline is left out because it can carry secrets."
    }
  }
}
